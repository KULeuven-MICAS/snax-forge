[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "snax-forge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["snax_forge"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# Only collect tests/, so a stray test_*.py elsewhere (kernels, out/) is never
# picked up. pythonpath lets plain `pytest` work outside pixi too; inside pixi
# the editable install already provides snax_forge.
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
