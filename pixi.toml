[workspace]
name = "snax-forge"
version = "0.1.0"
description = "Design-space exploration of accelerators in a SNAX compute cluster"
authors = ["Ryan <ryan@esat.kuleuven.be>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

# ---------------------------------------------------------------------------
# Python side: the kernels, DaCe (SDFG ingest) and every snax_forge
# package. A feature rather than top-level dependencies, so the `hw`
# environment below stays JVM-only.
# ---------------------------------------------------------------------------
[feature.py.dependencies]
python = "3.11.*"

# ---------------------------------------------------------------------------
# HARD PIN. networkx >= 3.6 breaks ALL DaCe 1.0.2 codegen.
#   KeyError: SDFGState  in  dace/sdfg/analysis/cfg.py :: block_parent_tree
#   (idom[block] lookup fails against the new dominator-tree return type)
# DaCe's own metadata only declares networkx>=2.5, so nothing upstream
# protects you here. Verified working: 3.1, 3.4.2, 3.5.
# Do not relax without re-running `pixi run check`.
# ---------------------------------------------------------------------------
networkx = ">=3.1,<3.6"

numpy = ">=1.26,<2"
sympy = ">=1.12"
# snax_cluster's cluster files (design/hjson_platform.py).
hjson-py = "==3.1.0"
# The generator's own schemas, and snax_cluster's for its cluster file (gen/).
jsonschema = ">=4.17,<5"

# DaCe shells out to cmake + a C++ compiler at *runtime* to build generated
# code. Pinning them here is what makes the golden-reference CPU compile
# reproducible across your laptop and the ESAT server.
# DaCe's setup.py also asks PyPI for scikit-build and cmake when no cmake
# >= 3.15 is on PATH while the lock is solved (ESAT's Vitis cmake 3.3.2):
# lock in the image (pixi 0.41.4, as CI), where they stay out; nothing uses them.
cmake = ">=3.27"
ninja = ">=1.11"
cxx-compiler = ">=1.7"

[feature.py.pypi-dependencies]
dace = "==1.0.2"
snax-forge = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8.0"
pytest-xdist = ">=3.5"
ruff = ">=0.6"
ipython = ">=8.0"

# ---------------------------------------------------------------------------
# Chisel side (hw/chisel): the accelerator blocks, their specs and Emit. A
# project of its own; nothing in it uses the Python side.
#
# `sbt` is the same conda-forge package snax_cluster uses; it drags in an
# openjdk, which is the only reason a JVM is not listed separately here.
# Keeping the version window identical to snax_cluster's (>=1.10.2,<2) means a
# machine that can build SNAX can build snax-forge without a second toolchain.
#
# The Chisel/FIRRTL jars themselves are NOT conda packages -- sbt resolves
# them from Maven Central on first build, and Chisel 6 additionally fetches
# the `firtool` binary (~40 MB) through firtool-resolver. Both land in the
# Coursier cache, so the first `chisel-test` is slow and every later one is
# not. That is expected, not a hang.
#
# verilator is for standalone RTL testbenches and for chiseltest's
# VerilatorBackendAnnotation. The current specs do not need it.
# ---------------------------------------------------------------------------
[feature.hw.dependencies]
sbt = ">=1.10.2,<2"
verilator = ">=5.30,<6"

[environments]
default = { features = ["py", "dev", "hw"], solve-group = "main" }
ci      = { features = ["py", "dev"],       solve-group = "main" }
hw      = { features = ["hw"],              solve-group = "main" }

[activation.env]
# Keep every generated build tree inside the repo so .gitignore catches it.
DACE_default_build_folder = "$PIXI_PROJECT_ROOT/out/.dacecache"
# Same idea for elaborated RTL: Emit.scala writes here.
SNAX_FORGE_HW_OUT = "$PIXI_PROJECT_ROOT/out/hw"
# ESAT machines ship a Vitis-bundled cmake 3.3.2 early on PATH, which shadows
# pixi's. Prepend the *active* environment's bin -- not a hardcoded "default",
# which would silently point `-e ci` and `-e hw` at the wrong prefix.
PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/$PIXI_ENVIRONMENT_NAME/bin:$PATH"
OMP_NUM_THREADS = "1"

[tasks]
check      = "python util/env_check.py"
test       = "pytest -q -n auto"
test-lower = "pytest -q tests/lower"
test-brm   = "pytest -q tests/brm tests/test_expr.py"
test-dfg   = "pytest -q tests/dfg tests/test_expr.py"
test-sandbox = "pytest -q tests/sandbox"
test-estimate = "pytest -q tests/estimate"
test-design = "pytest -q tests/design"
test-flow  = "pytest -q tests/flow"
test-run   = "pytest -q tests/run"
test-report = "pytest -q tests/report"
test-gen   = "pytest -q tests/gen"
test-kernels = "pytest -q tests/kernels"
test-viz   = "pytest -q tests/viz"
test-docs  = "pytest -q tests/test_contracts.py tests/test_md_reflow.py"
lint       = "ruff check util kernels snax_forge tests && ruff format --check util kernels snax_forge tests && python util/md_reflow.py --check"
fmt        = "ruff check --fix util kernels snax_forge tests && ruff format util kernels snax_forge tests"
# SDFG ingest: `pixi run sdfg vecadd` writes out/sdfg/vecadd.raw.sdfg and .simplified.sdfg
sdfg       = "python -m snax_forge.sdfg"
# SNAX-DFG importer: `pixi run import-dfg vecadd` writes out/dfg/vecadd.snaxdfg
import-dfg = "python -m snax_forge.dfg import"
# Reference executor: `pixi run check-dfg out/dfg/vecadd.snaxdfg --kernel vecadd`
check-dfg  = "python -m snax_forge.dfg check"
# SNAX-SANDBOX: `pixi run sandbox recipes/vecadd.json [--set W=8]` writes out/sandbox/vecadd/
sandbox    = "python -m snax_forge.sandbox"
# SNAX-DESIGN: `pixi run design out/sandbox/vecadd/2_bind.snaxdfg --platform platforms/small16.json
# [--set platform.PATH=VALUE] [--set memory.C.l1.base=N]` checks the pairing and writes out/design/vecadd/
# platform.json, memory.json and design_point.json; `design check ...` only checks, `design save SRC NAME`
# keeps a platform working copy as platforms/NAME.json; `design from-hjson HJSON NAME` reads snax_cluster's
# cluster file into platforms/NAME.json
design     = "python -m snax_forge.design"
# SNAX-LOWER: `pixi run lower tasks out/design/vecadd/design_point.json` writes tasks.json beside it
lower      = "python -m snax_forge.lower"
# The whole path (D136): `pixi run flow recipes/vecadd.json --platform platforms/snax_forge.json [--set W=8]`
# writes out/flow/vecadd/, builds and runs the generated program on SNAX-GVSoC and takes its own check; a bound
# graph in place of the recipe (`pixi run flow out/sandbox/vecadd/2_bind.snaxdfg --platform ...`) skips the sandbox (D108)
flow       = "python -m snax_forge.flow"
# Generator: `pixi run gen-gvsoc out/design/vecadd/design_point.json [--out DIR]` writes
# the cluster and streamer hjson and accelerator.json, the headers, data.h, main.c and manifest.json to
# out/gvsoc/<design>/
gen-gvsoc  = "python -m snax_forge.gen"
# Accelerator RTL (D130): `pixi run gen-rtl out/design/vecadd/design_point.json [OUT_DIR]` writes accelerator.json
# to out/rtl/<design>/, checks it against hw/chisel/blocks.json, then elaborates it through hw/chisel's `Emit --spec`
# into sv/ with emitted.json (java on a classpath sbt caches; the flow does not call it); `--fixture DIR` writes a
# fixture of the Chisel specs instead (its vectors.json; accelerator.json and the hjson are forge/'s)
gen-rtl    = "python -m snax_forge.gen.rtl"
# Bundle for snax_cluster (D130): `pixi run bundle out/design/vecadd/design_point.json [--out DIR]` writes
# gen-gvsoc's files, the RTL under rtl/ (sv/, emitted.json; sbt) with its file list rtl/files.f, and
# bundle.json to out/bundle/<design>/, everything made again; the flow does not call it
bundle     = "python -m snax_forge.gen.bundle"
# Recipe to snax_cluster: `pixi run forge recipes/vecadd.json [--platform P] [--set K=V] [--trace LEVEL]`
# runs the flow, the bundle of its design point (out/bundle/<name>/) and the bundle's program, checked to be the
# flow's ELF; each step's output in out/forge/<name>/forge.log, then snax_cluster's Verilator commands
forge      = "python -m snax_forge.flow.forge"
# A set of bundles for the local RTL check: `pixi run forge-set quick|full [--sim vsim|vlt] [-j N]` runs forge on
# each recipe of the set and writes out/forge-set/<set>.md, with the one line that checks them all in snax_cluster
forge-set  = "python -m snax_forge.flow.forge_set"
# Reports (D99): `pixi run report out/flow/vecadd` writes report/design.md and report/run.md beside run/
# (the flow writes them after every run)
report     = "python -m snax_forge.report"
# Kernels: `pixi run kernels` prints each kernel's directory, tier, dtype, and whether its SDFG builds
# and import-dfg takes it; it only reports
kernels    = "python util/kernels.py"
# DFG viewer: `pixi run view-dfg FILE|DIR ...` on http://127.0.0.1:8766/
view-dfg   = "python -m snax_forge.viz.dfg"
# DFG editor (D55, VIEW2): `pixi run edit-dfg [--kernel K --set N=64 | --recipe R | --session DIR]` on http://127.0.0.1:8767/
edit-dfg   = "python -m snax_forge.viz.dfg.edit"
# Viewer (D55): `pixi run view out/vecadd [out/other ...]`, then open http://127.0.0.1:8765/
view       = "python -m snax_forge.viz"
# Remove out/ (but the GVSoC build, out/snax-gvsoc/, unless --all), Python and test caches and
# Chisel build trees; `pixi run clean --dry-run` only lists them
clean      = "python util/clean.py"

# --- Chisel ---------------------------------------------------------------
# `-batch` stops sbt from dropping into its interactive shell when a command
# fails, which otherwise wedges CI until the job timeout.

[tasks.chisel-compile]
cmd = "sbt -batch compile"
cwd = "hw/chisel"
description = "Compile the Chisel sources (no elaboration)"

[tasks.chisel-test]
cmd = "sbt -batch test"
cwd = "hw/chisel"
description = "Run the chiseltest specs"

[tasks.chisel-gen]
cmd = "bash -c 'sbt -batch \"runMain snax.forge.Emit $*\"' --"
cwd = "hw/chisel"
description = "Elaborate modules to SystemVerilog in out/hw (args select targets)"

[tasks.chisel-fmt]
cmd = "sbt -batch scalafmtAll"
cwd = "hw/chisel"
description = "Format Scala sources with scalafmt"

[tasks.chisel-check]
cmd = "sbt -batch scalafmtCheckAll"
cwd = "hw/chisel"
description = "Fail if Scala sources are unformatted"

[tasks.chisel-clean]
cmd = "rm -rf hw/chisel/target hw/chisel/project/target hw/chisel/project/project hw/chisel/test_run_dir out/hw"
description = "Drop all Chisel build artefacts (keeps the Coursier cache)"
