[workspace]
name = "snax-forge"
version = "0.1.0"
description = "Design-space exploration of accelerators in a SNAX compute cluster"
authors = ["Ryan <ryan@esat.kuleuven.be>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

# ---------------------------------------------------------------------------
# Python side: the kernels, DaCe (SDFG ingest, IMP1) and every snax_forge
# package. A feature rather than top-level dependencies, so the `hw`
# environment below stays JVM-only.
# ---------------------------------------------------------------------------
[feature.py.dependencies]
python = "3.11.*"

# ---------------------------------------------------------------------------
# HARD PIN. networkx >= 3.6 breaks ALL DaCe 1.0.2 codegen.
#   KeyError: SDFGState  in  dace/sdfg/analysis/cfg.py :: block_parent_tree
#   (idom[block] lookup fails against the new dominator-tree return type)
# DaCe's own metadata only declares networkx>=2.5, so nothing upstream
# protects you here. Verified working: 3.1, 3.4.2, 3.5.
# Do not relax without re-running `pixi run check`.
# ---------------------------------------------------------------------------
networkx = ">=3.1,<3.6"

numpy = ">=1.26,<2"
sympy = ">=1.12"

# DaCe shells out to cmake + a C++ compiler at *runtime* to build generated
# code. Pinning them here is what makes the golden-reference CPU compile
# reproducible across your laptop and the ESAT server.
cmake = ">=3.27"
ninja = ">=1.11"
cxx-compiler = ">=1.7"

[feature.py.pypi-dependencies]
dace = "==1.0.2"
snax-forge = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8.0"
pytest-xdist = ">=3.5"
ruff = ">=0.6"
ipython = ">=8.0"

# ---------------------------------------------------------------------------
# Chisel side (hw/chisel): the accelerator blocks, their specs and Emit. A
# project of its own; nothing in it uses the Python side.
#
# `sbt` is the same conda-forge package snax_cluster uses; it drags in an
# openjdk, which is the only reason a JVM is not listed separately here.
# Keeping the version window identical to snax_cluster's (>=1.10.2,<2) means a
# machine that can build SNAX can build snax-forge without a second toolchain.
#
# The Chisel/FIRRTL jars themselves are NOT conda packages -- sbt resolves
# them from Maven Central on first build, and Chisel 6 additionally fetches
# the `firtool` binary (~40 MB) through firtool-resolver. Both land in the
# Coursier cache, so the first `chisel-test` is slow and every later one is
# not. That is expected, not a hang.
#
# verilator is for standalone RTL testbenches and for chiseltest's
# VerilatorBackendAnnotation. The current specs do not need it.
# ---------------------------------------------------------------------------
[feature.hw.dependencies]
sbt = ">=1.10.2,<2"
verilator = ">=5.30,<6"

[environments]
default = { features = ["py", "dev", "hw"], solve-group = "main" }
ci      = { features = ["py", "dev"],       solve-group = "main" }
hw      = { features = ["hw"],              solve-group = "main" }

[activation.env]
# Keep every generated build tree inside the repo so .gitignore catches it.
DACE_default_build_folder = "$PIXI_PROJECT_ROOT/out/.dacecache"
# Same idea for elaborated RTL: Emit.scala writes here.
SNAX_FORGE_HW_OUT = "$PIXI_PROJECT_ROOT/out/hw"
# ESAT machines ship a Vitis-bundled cmake 3.3.2 early on PATH, which shadows
# pixi's. Prepend the *active* environment's bin -- not a hardcoded "default",
# which would silently point `-e ci` and `-e hw` at the wrong prefix.
PATH = "$PIXI_PROJECT_ROOT/.pixi/envs/$PIXI_ENVIRONMENT_NAME/bin:$PATH"
OMP_NUM_THREADS = "1"

[tasks]
check      = "python util/env_check.py"
test       = "pytest -q"
test-model = "pytest -q tests/snax_model"
test-lower = "pytest -q tests/lower"
test-brm   = "pytest -q tests/brm tests/test_expr.py"
test-dfg   = "pytest -q tests/dfg tests/test_expr.py"
test-sandbox = "pytest -q tests/sandbox"
test-design = "pytest -q tests/design"
test-flow  = "pytest -q tests/flow"
lint       = "ruff check util kernels snax_forge tests scenarios && ruff format --check util kernels snax_forge tests scenarios"
fmt        = "ruff check --fix util kernels snax_forge tests scenarios && ruff format util kernels snax_forge tests scenarios"
# SDFG ingest: `pixi run forge vecadd` writes out/sdfg/vecadd.raw.sdfg and .simplified.sdfg
forge      = "python -m snax_forge.sdfg"
# SNAX-DFG importer (IMP1): `pixi run import-dfg vecadd` writes out/dfg/vecadd.snaxdfg
import-dfg = "python -m snax_forge.dfg import"
# Reference executor (REF1): `pixi run check-dfg out/dfg/vecadd.snaxdfg --kernel vecadd`
check-dfg  = "python -m snax_forge.dfg check"
# SNAX-SANDBOX (SBX1): `pixi run sandbox recipes/vecadd.json [--set W=8]` writes out/sandbox/vecadd/
sandbox    = "python -m snax_forge.sandbox"
# SNAX-DESIGN (DP1a, DP1b): `pixi run design out/sandbox/vecadd/2_bind.snaxdfg --platform platforms/small16.json
# [--set platform.PATH=VALUE] [--set memory.C.l1.base=N]` checks the pairing and writes out/design/vecadd/
# platform.json, memory.json and design_point.json; `design check ...` only checks, `design save SRC NAME`
# keeps a platform working copy as platforms/NAME.json
design     = "python -m snax_forge.design"
# SNAX-LOWER (LOW1c, LOW1a): `pixi run lower cluster|tasks out/design/vecadd/design_point.json` writes
# cluster.json or tasks.json beside it
lower      = "python -m snax_forge.lower"
# The whole path (E2E1): `pixi run flow recipes/vecadd.json --platform platforms/small16.json [--set W=8]`
# writes out/flow/vecadd/ and checks the run against the kernel reference and REF1
flow       = "python -m snax_forge.flow"
# DFG viewer (VIS5): `pixi run view-dfg FILE|DIR ...` on http://127.0.0.1:8766/
view-dfg   = "python -m snax_forge.viz.dfg"
# SNAX-MODEL scenarios (MOD9): `pixi run model-run scenarios/vecadd/scenario.json --out out/vecadd`.
# The scenario files are generated, not in git (D67): `scenarios` writes them, model-run first.
scenarios  = "python scenarios/make.py"
model-run  = { cmd = "python -m snax_forge.snax_model run", depends-on = ["scenarios"] }
# Viewer (VIS1, D55): `pixi run view out/vecadd [out/other ...]`, then open http://127.0.0.1:8765/
view       = "python -m snax_forge.viz"
# Remove out/, Python and test caches and Chisel build trees; `pixi run clean --dry-run` only lists them
clean      = "python util/clean.py"

# --- Chisel ---------------------------------------------------------------
# `-batch` stops sbt from dropping into its interactive shell when a command
# fails, which otherwise wedges CI until the job timeout.

[tasks.chisel-compile]
cmd = "sbt -batch compile"
cwd = "hw/chisel"
description = "Compile the Chisel sources (no elaboration)"

[tasks.chisel-test]
cmd = "sbt -batch test"
cwd = "hw/chisel"
description = "Run the chiseltest specs"

[tasks.chisel-gen]
cmd = "bash -c 'sbt -batch \"runMain snax.forge.Emit $*\"' --"
cwd = "hw/chisel"
description = "Elaborate modules to SystemVerilog in out/hw (args select targets)"

[tasks.chisel-fmt]
cmd = "sbt -batch scalafmtAll"
cwd = "hw/chisel"
description = "Format Scala sources with scalafmt"

[tasks.chisel-check]
cmd = "sbt -batch scalafmtCheckAll"
cwd = "hw/chisel"
description = "Fail if Scala sources are unformatted"

[tasks.chisel-clean]
cmd = "rm -rf hw/chisel/target hw/chisel/project/target hw/chisel/project/project hw/chisel/test_run_dir out/hw"
description = "Drop all Chisel build artefacts (keeps the Coursier cache)"
