name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  env-check:
    name: Environment check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          # Pin the pixi binary itself so a pixi release can't change
          # solver behaviour underneath a green build.
          pixi-version: v0.41.4
          environments: default
          # Fail if pixi.lock is stale w.r.t. pixi.toml, rather than
          # silently re-solving. Regenerate locally with `pixi install`.
          locked: true
          cache: true
          # Only main writes the cache; PRs read it. Stops a branch with a
          # one-off dependency from evicting the good cache entry.
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: env_check
        run: pixi run check

  python:
    name: Python lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.41.4
          environments: ci
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - name: Lint
        run: pixi run -e ci lint

      # Every test block. `test` runs everything under tests/, so new tests
      # are picked up without touching CI.
      - name: Tests
        run: pixi run -e ci test

  chisel:
    name: Chisel format + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.8
        with:
          pixi-version: v0.41.4
          environments: hw
          locked: true
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      # Separate from the pixi cache on purpose: this holds the Maven
      # artefacts and the firtool binary, which pixi knows nothing about.
      # Without it every run re-downloads ~200 MB of jars.
      - name: Cache Coursier / sbt
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/coursier
            ~/.ivy2/cache
            ~/.sbt
          key: sbt-${{ hashFiles('hw/chisel/build.sbt', 'hw/chisel/project/*') }}
          restore-keys: sbt-

      - name: Format check
        run: pixi run -e hw chisel-check

      - name: Tests
        run: pixi run -e hw chisel-test

      # Every configuration in Emit's catalogue, elaborated to SystemVerilog.
      - name: Elaborate the module catalogue
        run: pixi run -e hw chisel-gen

      # firtool failures do not always propagate as a non-zero exit from sbt,
      # so assert the artefacts exist rather than trusting the status.
      - name: Assert catalogue RTL was produced
        run: |
          ls -la out/hw
          test -f out/hw/SimpleAdder.sv
          test -f out/hw/Accumulator.sv
          test -f out/hw/ElementwiseLoop_w32_t32_sel8.sv
          test -f out/hw/ElementwiseTiledSpatial_w32_n64_t32_add.sv

  # The flow on SNAX-GVSoC (D136): GVSoC built from the submodule, then
  # `pixi run flow` on vecadd and vsum and the tests marked `gvsoc`. The only
  # job that fetches the submodule (D128); snax-gvsoc's own CI never needs
  # snax-forge.
  gvsoc:
    name: Flow on SNAX-GVSoC
    # Only hosts Docker and Node; pinned as snax-gvsoc's CI is.
    runs-on: ubuntu-24.04
    # A cold GVSoC build (no ccache) takes most of it; snax-gvsoc's job (build
    # and regress) fits in 30.
    timeout-minutes: 45
    # Public image with GVSoC's build tools, snax_cluster's toolchain and pixi (D118).
    container: ghcr.io/kuleuven-micas/snax-forge:main
    defaults:
      run:
        shell: bash
    steps:
      # gvsoc/snax-gvsoc, the only submodule, at the pinned commit, shallow.
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      # ccache for GVSoC's C++ build, as snax-gvsoc's CI: $GITHUB_WORKSPACE is
      # the container's path; CMake takes the launchers from the environment.
      - name: ccache environment
        run: |
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache" >> "$GITHUB_ENV"

      # The latest saved ccache of this job, from any branch this run may read.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-gvsoc-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-gvsoc-

      # GVSoC for snax-gvsoc's SNAX_TARGETS into out/snax-gvsoc/, then ccache's hit rate.
      - name: Build GVSoC
        id: build
        run: |
          make -C gvsoc build CMAKE_FLAGS=-j$(nproc)
          ccache -s

      # The image's pixi; pixi.lock as checked in.
      - name: pixi environment
        run: pixi install -e ci

      - name: Flow on vecadd
        run: pixi run -e ci flow recipes/vecadd.json --platform platforms/snax_alu.json

      - name: Flow on vsum
        run: pixi run -e ci flow recipes/vsum.json --platform platforms/snax_alu.json

      - name: Tests marked gvsoc
        run: pixi run -e ci pytest -q -m gvsoc

      # Each flow's log, make output and run, when a step failed.
      - name: Upload flow logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flow-logs
          path: |
            out/flow/*/*.log
            out/flow/*/run/*.txt
          if-no-files-found: ignore

      # Saved on every run with a build, PRs included, as snax-gvsoc's CI.
      - name: Save ccache
        if: always() && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-gvsoc-${{ github.run_id }}-${{ github.run_attempt }}
